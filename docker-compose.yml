services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_URL=postgresql+asyncpg://webhookforge:webhookforge@postgres:5432/webhookforge
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - API_KEY=${API_KEY:-dev-api-key}
      - MAX_DELIVERY_RETRIES=4
      - DELIVERY_TIMEOUT_SECONDS=5
      - MAX_PAYLOAD_SIZE_BYTES=65536
      - RATE_LIMIT_EVENTS_PER_MINUTE=100
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - metrics_data:/tmp/prometheus
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery_worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    environment:
      - POSTGRES_URL=postgresql+asyncpg://webhookforge:webhookforge@postgres:5432/webhookforge
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - MAX_DELIVERY_RETRIES=4
      - DELIVERY_TIMEOUT_SECONDS=5
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - metrics_data:/tmp/prometheus
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -t 5 2>/dev/null | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 25s

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: webhookforge
      POSTGRES_PASSWORD: webhookforge
      POSTGRES_DB: webhookforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhookforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  metrics_data:
  postgres_data:
